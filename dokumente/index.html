    :root {
      --rot: #C71211;    /* Raketenrot: nur im Karo-Band */
      --karo: #A3A3A3;   /* Silber im Karo-Muster */
      --grau: #4A4A4A;   /* Bahngrau */
      --gelb: #F4DC1A;   /* Signalgelb: nur Tastatur-Fokus */
      --linie: rgba(255, 255, 255, 0.4);
      --linie-leise: rgba(255, 255, 255, 0.25);
      --trenner: rgba(255, 255, 255, 0.15);
      --kopf: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--grau);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Karo-Band: eine Reihe (40px) plus Statusleiste. Einzige rote Fläche. */
    .band {
      width: 100%;
      height: calc(40px + env(safe-area-inset-top, 0px));
      flex-shrink: 0;
      background-color: var(--rot);
      background-image:
        linear-gradient(45deg, var(--karo) 25%, transparent 25%),
        linear-gradient(-45deg, var(--karo) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--karo) 75%),
        linear-gradient(-45deg, transparent 75%, var(--karo) 75%);
      background-size: 80px 80px;
      background-position: 0 0, 0 40px, 40px -40px, -40px 0;
    }

    .topbar {
      width: 100%;
      max-width: 500px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 10px 16px 6px;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      border: 1px solid var(--linie-leise);
      border-radius: 25px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .back-btn:active { background-color: rgba(255, 255, 255, 0.15); transform: scale(0.98); }

    .title-box { text-align: center; }

    h1 {
      font-family: var(--kopf);
      font-style: italic;
      font-weight: 800;
      font-size: 30px;
      line-height: 1.05;
    }

    .subtitle {
      font-size: 14px;
      color: #dddddd;
      margin-top: 2px;
      font-style: italic;
    }

    .screen {
      width: 100%;
      max-width: 500px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Liste: scrollt, wenn mehr Dokumente aufgeklappt sind */
    .docs-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px 16px;
    }

    /* Bereiche (<details>) */
    .toggle-group {
      flex-shrink: 0;
      border: 1px solid var(--linie);
      border-radius: 25px;
      overflow: hidden;
    }

    .toggle-header {
      min-height: 54px;
      padding: 8px 20px;
      font-size: 17px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      list-style: none;
      transition: background-color 0.2s;
    }
    .toggle-header::-webkit-details-marker { display: none; }
    .toggle-header:active { background-color: rgba(255, 255, 255, 0.1); }
    .toggle-header:focus-visible { outline: 2px solid var(--gelb); outline-offset: -4px; border-radius: 25px; }

    .toggle-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.7);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }
    .toggle-group[open] .toggle-icon { transform: rotate(180deg); }

    /* Dokumente als ruhige Zeilen */
    .doc-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 10px 20px;
      text-decoration: none;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.3;
      border-top: 1px solid var(--trenner);
      transition: background-color 0.2s;
    }
    .doc-btn:active { background-color: rgba(255, 255, 255, 0.12); }
    .doc-btn:focus-visible { outline: 2px solid var(--gelb); outline-offset: -4px; }
    .doc-btn .art { flex-shrink: 0; font-size: 13px; color: rgba(255, 255, 255, 0.6); }

    .empty-info {
      padding: 14px 20px;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      font-style: italic;
      border-top: 1px solid var(--trenner);
    }

    /* Footer / Instagram */
    .footer {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--trenner);
    }
    .instagram-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .instagram-link:active { opacity: 1; }
    .instagram-link:focus-visible { outline: 2px solid var(--gelb); outline-offset: 2px; border-radius: 12px; }
    .instagram-icon { width: 22px; height: 22px; fill: #ffffff; }

    @media (prefers-reduced-motion: reduce) {
      .back-btn, .toggle-header, .toggle-icon, .doc-btn, .instagram-link { transition: none; }
    }
  </style>
</head>

  <div class="band" role="presentation"></div>

  <div class="topbar">
    <a href="../startseite/" class="back-btn" aria-label="Zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
