<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b31217">
  <title>KC Rakete - Dokumente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Header mit rot-weißem Schachbrettmuster über die VOLLE Bildschirmbreite */
    .header-banner {
      width: 100vw;
      height: clamp(120px, 20vh, 220px);
      padding-top: env(safe-area-inset-top);
      background-color: #b31217;
      background-image: 
        linear-gradient(45deg, #a3a3a3 25%, transparent 25%), 
        linear-gradient(-45deg, #a3a3a3 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #a3a3a3 75%), 
        linear-gradient(-45deg, transparent 75%, #a3a3a3 75%);
      background-size: 80px 80px;
      background-position: 0 0, 0 40px, 40px -40px, -40px 0px;
      position: relative;
      flex-shrink: 0;
      z-index: 1;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: max-width 0.3s ease;
      z-index: 2;
    }

    /* Responsive Optimierung für Laptop / größere Bildschirme */
    @media (min-width: 768px) {
      .app-container {
        max-width: 900px;
      }
    }

    /* Grade Kante des Hauptinhalts */
    .content-card {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      margin-top: -30px;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px clamp(15px, 3vh, 30px) 20px;
      position: relative;
      z-index: 2;
      justify-content: space-between;
    }

    /* Zurück Button oben links */
    .back-btn-top {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      background-color: transparent;
      transition: background-color 0.2s, transform 0.1s;
      z-index: 4;
      cursor: pointer;
    }

    .back-btn-top:active {
      background-color: rgba(255, 255, 255, 0.2);
      transform: scale(0.98);
    }

    /* Titel & Untertitel */
    .title {
      font-size: clamp(22px, 3.5vh, 32px);
      font-weight: bold;
      margin-top: clamp(25px, 4vh, 35px);
      text-align: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .subtitle {
      font-size: clamp(12px, 1.8vh, 16px);
      color: #dddddd;
      margin-top: 4px;
      margin-bottom: clamp(15px, 2.5vh, 25px);
      text-align: center;
      font-style: italic;
      flex-shrink: 0;
    }

    /* Dokumente Liste Container */
    .docs-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.5vh, 12px);
      margin-bottom: clamp(10px, 2vh, 20px);
      overflow-y: auto;
      touch-action: pan-y;
      padding-right: 2px;
    }

    .doc-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 25px;
      padding: clamp(10px, 1.5vh, 14px) 12px;
      font-size: clamp(13px, 1.8vh, 15px);
      text-align: center;
      background-color: transparent;
      transition: background-color 0.2s, transform 0.1s;
      min-height: clamp(44px, 6.5vh, 54px);
      cursor: pointer;
      width: 100%;
    }

    .doc-btn:active {
      background-color: rgba(255, 255, 255, 0.2);
      transform: scale(0.98);
    }

    /* Footer / Instagram */
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 5px;
      flex-shrink: 0;
    }

    .instagram-link {
      display: inline-block;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .instagram-link:active {
      opacity: 1;
    }

    .instagram-icon {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="header-banner"></div>

  <div class="app-container">
    <div class="content-card">
      <a href="/webapp/" class="back-btn-top">‹ Zurück</a>

      <h1 class="title">Dokumente</h1>
      <p class="subtitle">KC Rakete Unterlagen & Listen</p>

      <div class="docs-container">
        <a href="2025-06-18 Anwesenheitsliste.pdf" target="_blank" class="doc-btn">2025-06-18 Anwesenheitsliste</a>
        <a href="2025-07-25 Mitgliederversammlung.pdf" target="_blank" class="doc-btn">2025-07-25 Mitgliederversammlung</a>
        <a href="ALT_Kegelabgabenordnung.pdf" target="_blank" class="doc-btn">ALT Kegelabgabenordnung</a>
        <a href="Blanko Anwesenheitsliste.pdf" target="_blank" class="doc-btn">Blanko Anwesenheitsliste</a>
        <a href="Blanko Strafenliste.pdf" target="_blank" class="doc-btn">Blanko Strafenliste</a>
      </div>

      <div class="footer">
        <a href="https://www.instagram.com/kcrakete" target="_blank" class="instagram-link" aria-label="Instagram">
          <svg class="instagram-icon" viewBox="0 0 24 24">

          </svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Zoom/Pinch/Gesture Events blockieren
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
