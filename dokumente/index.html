<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b31217">
  <title>KC Rakete - Dokumente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Zurück Button fest oben links platziert, über dem Muster */
    .back-btn-top {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      left: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      text-decoration: none;
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background-color 0.2s, transform 0.1s;
      z-index: 10;
      cursor: pointer;
    }

    .back-btn-top:active {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    .back-btn-top svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Header Banner: Exakt 3 Reihen Rot/Silber-Schachbrett (Höhe = 3 * Kachelhöhe) */
    .header-banner {
      width: 100vw;
      --tileSize: clamp(24px, 4vw, 36px);
      height: calc((var(--tileSize) * 3) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background-color: #b31217;
      background-image: 
        linear-gradient(45deg, #c0c0c0 25%, transparent 25%), 
        linear-gradient(-45deg, #c0c0c0 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #c0c0c0 75%), 
        linear-gradient(-45deg, transparent 75%, #c0c0c0 75%);
      background-size: calc(var(--tileSize) * 2) calc(var(--tileSize) * 2);
      background-position: 0 0, 0 var(--tileSize), var(--tileSize) calc(var(--tileSize) * -1), calc(var(--tileSize) * -1) 0px;
      position: relative;
      flex-shrink: 0;
      z-index: 1;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: max-width 0.3s ease;
      z-index: 2;
      height: calc(100% - clamp(72px, 12vw, 108px));
    }

    /* Responsive Optimierung für Mac / Desktop */
    @media (min-width: 768px) {
      .app-container {
        max-width: 750px;
      }
    }

    /* Hauptinhalt */
    .content-card {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 20px clamp(15px, 3vh, 25px) 20px;
      position: relative;
      z-index: 2;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Titel & Untertitel */
    .title {
      font-size: clamp(22px, 3.5vh, 30px);
      font-weight: bold;
      margin-top: 5px;
      text-align: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .subtitle {
      font-size: clamp(12px, 1.8vh, 15px);
      color: #dddddd;
      margin-top: 4px;
      margin-bottom: clamp(12px, 2vh, 20px);
      text-align: center;
      font-style: italic;
      flex-shrink: 0;
    }

    /* Dokumente Container */
    .docs-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
      overflow-y: auto;
      touch-action: pan-y;
      padding-right: 4px;
    }

    /* Styled Toggle Sections (<details>) */
    .toggle-group {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      background-color: rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .toggle-header {
      padding: 14px 16px;
      font-size: clamp(14px, 2vh, 16px);
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      list-style: none;
      transition: background-color 0.2s;
    }

    .toggle-header::-webkit-details-marker {
      display: none;
    }

    .toggle-header:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .toggle-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .toggle-group[open] .toggle-icon {
      transform: rotate(180deg);
    }

    .toggle-content {
      padding: 10px 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(0, 0, 0, 0.1);
    }

    .doc-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 10px 12px;
      font-size: clamp(13px, 1.8vh, 14px);
      text-align: center;
      background-color: transparent;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 42px;
      cursor: pointer;
      width: 100%;
    }

    .doc-btn:active {
      background-color: rgba(255, 255, 255, 0.2);
      transform: scale(0.98);
    }

    .empty-info {
      font-size: 13px;
      color: #aaaaaa;
      text-align: center;
      padding: 8px;
      font-style: italic;
    }

    /* Footer / Instagram */
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 5px;
      flex-shrink: 0;
    }

    .instagram-link {
      display: inline-block;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .instagram-link:active {
      opacity: 1;
    }

    .instagram-icon {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Icon Zurück-Button führt relativ zum Ordner startseite -->
  <a href="../startseite/" class="back-btn-top" aria-label="Zurück">
    <svg viewBox="0 0 24 24">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </a>

  <!-- Banner mit genau 3 Reihen Rot/Silber -->
  <div class="header-banner"></div>

  <div class="app-container">
    <div class="content-card">

      <h1 class="title">Dokumente</h1>
      <p class="subtitle">KC Rakete Unterlagen & Listen</p>

      <div class="docs-container">
        
        <!-- Toggle: Versammlungen / Beschlüsse -->
        <details class="toggle-group" open>
          <summary class="toggle-header">
            <span>Versammlungen / Beschlüsse</span>
            <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </summary>
          <div class="toggle-content">
            <a href="2025-06-18 Anwesenheitsliste.pdf" target="_blank" class="doc-btn">2025-06-18 Anwesenheitsliste</a>
            <a href="2025-07-25 Mitgliederversammlung.pdf" target="_blank" class="doc-btn">2025-07-25 Mitgliederversammlung</a>
          </div>
        </details>

        <!-- Toggle: Blanko's -->
        <details class="toggle-group">
          <summary class="toggle-header">
            <span>Blanko's</span>
            <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </summary>
          <div class="toggle-content">
            <a href="Blanko Anwesenheitsliste.pdf" target="_blank" class="doc-btn">Blanko Anwesenheitsliste</a>
            <a href="Blanko Strafenliste.pdf" target="_blank" class="doc-btn">Blanko Strafenliste</a>
          </div>
        </details>

        <!-- Toggle: Aktuelles -->
        <details class="toggle-group">
          <summary class="toggle-header">
            <span>Aktuelles</span>
            <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </summary>
          <div class="toggle-content">
            <div class="empty-info">Keine aktuellen Dokumente</div>
          </div>
        </details>

        <!-- Toggle: Archiv -->
        <details class="toggle-group">
          <summary class="toggle-header">
            <span>Archiv</span>
            <svg class="toggle-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </summary>
          <div class="toggle-content">
            <a href="ALT_Kegelabgabenordnung.pdf" target="_blank" class="doc-btn">ALT Kegelabgabenordnung</a>
          </div>
        </details>

      </div>

      <div class="footer">
        <a href="https://www.instagram.com/kcrakete" target="_blank" class="instagram-link" aria-label="Instagram">
          <svg class="instagram-icon" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Zoom/Pinch/Gesture Events blockieren
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
