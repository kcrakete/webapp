<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b31217">
  <title>KC Rakete</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Header Banner: Exakt 3 Reihen Rot/Silber-Schachbrett */
    .header-banner {
      width: 100vw;
      --tileSize: clamp(24px, 4vw, 36px);
      height: calc((var(--tileSize) * 3) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background-color: #b31217;
      background-image: 
        linear-gradient(45deg, #c0c0c0 25%, transparent 25%), 
        linear-gradient(-45deg, #c0c0c0 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #c0c0c0 75%), 
        linear-gradient(-45deg, transparent 75%, #c0c0c0 75%);
      background-size: calc(var(--tileSize) * 2) calc(var(--tileSize) * 2);
      background-position: 0 0, 0 var(--tileSize), var(--tileSize) calc(var(--tileSize) * -1), calc(var(--tileSize) * -1) 0px;
      position: relative;
      flex-shrink: 0;
      z-index: 1;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: max-width 0.3s ease;
      z-index: 2;
      height: calc(100% - clamp(72px, 12vw, 108px));
    }

    @media (min-width: 768px) {
      .app-container {
        max-width: 750px;
      }
    }

    /* Hauptinhalt mit Hintergrund-Logo */
    .content-card {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px clamp(20px, 4vh, 35px) 20px;
      position: relative;
      z-index: 2;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Dezent Transparentes Logo im Hintergrund */
    .bg-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(260px, 65vw, 450px);
      height: clamp(260px, 65vw, 450px);
      opacity: 0.20;
      pointer-events: none;
      z-index: 1;
      object-fit: contain;
    }

    /* Inhaltselemente über dem Hintergrund-Logo */
    .main-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* Titel & Untertitel */
    .title-box {
      text-align: center;
      flex-shrink: 0;
    }

    .title {
      font-size: clamp(24px, 4vh, 34px);
      font-weight: bold;
      color: #ffffff;
    }

    .subtitle {
      font-size: clamp(13px, 2vh, 16px);
      color: #dddddd;
      margin-top: 4px;
      font-style: italic;
    }

    /* Termine Box */
    .events-box {
      width: 100%;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: clamp(14px, 2.5vh, 22px) 16px;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      flex-shrink: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .events-title {
      font-size: clamp(18px, 2.8vh, 24px);
      font-weight: 600;
      margin-bottom: clamp(8px, 1.5vh, 14px);
      color: #ffffff;
    }

    .events-list p {
      font-size: clamp(13px, 1.9vh, 15px);
      line-height: 1.45;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .events-list p:last-child {
      margin-bottom: 0;
    }

    /* Buttons Grid (2-spaltig) */
    .button-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 1.8vh, 14px);
      flex-shrink: 0;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 10px 8px;
      font-size: clamp(13px, 1.8vh, 14px);
      text-align: center;
      background-color: rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s, transform 0.1s;
      min-height: clamp(44px, 6.5vh, 52px);
      cursor: pointer;
    }

    .btn:active {
      background-color: rgba(255, 255, 255, 0.25);
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Banner mit genau 3 Reihen Rot/Silber -->
  <div class="header-banner"></div>

  <div class="app-container">
    <div class="content-card">
      
      <!-- Logo im Hintergrund -->
      <img src="rakete.png" alt="" class="bg-logo">

      <div class="main-content">
        <div class="title-box">
          <h1 class="title">KC Rakete</h1>
          <p class="subtitle">Und niemals vergessen - KC Rakete!</p>
        </div>

        <div class="events-box">
          <h2 class="events-title">Nächste Termine</h2>
          <div class="events-list">
            <p>Kegeln: jeden vierten Freitag, 18 Uhr, Zur Krone</p>
            <p>Kegeltour: 26. Mai bis 30. Mai 2027</p>
            <p>Kegelturnier: 2026 offen</p>
          </div>
        </div>

        <div class="button-grid">
          <a href="/webapp/teams/" class="btn">Teams auslosen</a>
          <a href="/webapp/kallen/" class="btn">Ewige Kallen Tabelle</a>
          <a href="/webapp/ao/" class="btn">Kegelabgabenordnung</a>
          <a href="/webapp/chronik/" class="btn">Chronik</a>
          <a href="/webapp/bilder/" class="btn">Bilder</a>
          <a href="/webapp/dokumente/" class="btn">Dokumente</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Zoom/Pinch/Gesture und Scroll-Events via JS blockieren
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('wheel', function(e) { e.preventDefault(); }, { passive: false });
  </script>
</body>
</html>
