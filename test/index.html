<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b31217">
  
  <!-- Favicon, Lesezeichen-Symbol & WebApp Logo -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  
  <title>KC Rakete</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Header mit genau 3 Reihen rot-silbernem Muster */
    .header-banner {
      width: 100vw;
      height: 120px; /* Fixiert auf genau 3 Reihen à 40px */
      padding-top: env(safe-area-inset-top);
      background-color: #b31217;
      background-image: 
        linear-gradient(45deg, #a3a3a3 25%, transparent 25%), 
        linear-gradient(-45deg, #a3a3a3 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #a3a3a3 75%), 
        linear-gradient(-45deg, transparent 75%, #a3a3a3 75%);
      background-size: 80px 80px; /* 40px Reihenhöhe */
      background-position: 0 0, 0 40px, 40px -40px, -40px 0px;
      position: relative;
      flex-shrink: 0;
      z-index: 1;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: max-width 0.3s ease;
      z-index: 2;
    }

    /* Responsive Optimierung für Laptop / größere Bildschirme */
    @media (min-width: 768px) {
      .app-container {
        max-width: 900px;
      }
    }

    /* Kerzengerade Kante direkt am Kästchen-Raster bündig */
    .content-card {
      width: 100%;
      height: 100%;
      background-color: #4a4a4a;
      margin-top: 0;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px clamp(15px, 3vh, 30px) 20px;
      position: relative;
      z-index: 2;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Logo als dezenter Hintergrund mit geringer Deckkraft */
    .content-card::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      background-image: url('rakete.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.15; /* Hier die Deckkraft anpassen (0.1 bis 1.0) */
      pointer-events: none;
      z-index: 0;
    }

    /* Titel & Untertitel */
    .title {
      font-size: clamp(22px, 3.5vh, 32px);
      font-weight: bold;
      margin-top: clamp(15px, 3vh, 30px);
      text-align: center;
      color: #ffffff;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: clamp(12px, 1.8vh, 16px);
      color: #dddddd;
      margin-top: 2px;
      margin-bottom: clamp(10px, 2vh, 20px);
      text-align: center;
      font-style: italic;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* Termine Box - Transparent mit dünner Linie */
    .events-box {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      padding: clamp(12px, 2vh, 20px) 15px;
      text-align: center;
      margin-bottom: clamp(10px, 1.8vh, 18px);
      background-color: transparent;
      flex-shrink: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .events-title {
      font-size: clamp(20px, 3vh, 26px);
      font-weight: normal;
      margin-bottom: clamp(8px, 1.2vh, 12px);
      color: #ffffff;
    }

    .events-list p {
      font-size: clamp(13px, 1.8vh, 15px);
      line-height: 1.4;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .events-list p:last-child {
      margin-bottom: 0;
    }

    /* Buttons Grid (2-spaltig) */
    .button-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 1.5vh, 12px);
      margin-bottom: clamp(10px, 2vh, 20px);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* Buttons - Transparent mit dünner Linie */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      padding: clamp(8px, 1.2vh, 12px) 8px;
      font-size: clamp(12px, 1.8vh, 14px);
      text-align: center;
      background-color: transparent;
      transition: background-color 0.2s, transform 0.1s;
      min-height: clamp(42px, 6vh, 52px);
      cursor: pointer;
    }

    .btn:active {
      background-color: rgba(255, 255, 255, 0.15);
      transform: scale(0.98);
    }

    /* Footer / Instagram */
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 5px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .instagram-link {
      display: inline-block;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .instagram-link:active {
      opacity: 1;
    }

    .instagram-icon {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    /* Modal / Dokumente-Maske ohne Hintergrundabdunklung */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
      touch-action: none;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      width: 90%;
      max-width: 500px;
      background-color: #4a4a4a;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      touch-action: none;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
      color: #ffffff;
    }

    .modal-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .close-btn {
      margin-top: 10px;
      width: 100%;
      max-width: 200px;
      border-color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="header-banner"></div>

  <div class="app-container">
    <div class="content-card">
      <h1 class="title">KC Rakete</h1>
      <p class="subtitle">Und niemals vergessen - KC Rakete!</p>

      <div class="events-box">
        <h2 class="events-title">Nächste Termine</h2>
        <div class="events-list">
          <p>Kegeln: jeden vierten Freitag, 18 Uhr, Zur Krone</p>
          <p>Kegeltour: 26. Mai bis 30. Mai 2027</p>
          <p>Kegelturnier: 2026 offen</p>
        </div>
      </div>

      <div class="button-grid">
        <a href="/webapp/teams/" class="btn">Teams auslosen</a>
        <a href="/webapp/kallen/" class="btn">Ewige Kallen Tabelle</a>
        <a href="/webapp/ao/" class="btn">Kegelabgabenordnung</a>
        <a href="/webapp/chronik/" class="btn">Chronik</a>
        <a href="/webapp/bilder/" class="btn">Bilder</a>
        <a href="/webapp/dokumente/" class="btn">Dokumente</a>
      </div>

      <div class="footer">
        <a href="https://www.instagram.com/kcrakete" target="_blank" class="instagram-link" aria-label="Instagram">
          <svg class="instagram-icon" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Dokumente Overlay/Maske -->
  <div id="docsModal" class="modal-overlay">
    <div class="modal-content">
      <h2 class="modal-title">Dokumente</h2>
      <div class="modal-buttons">
        <button class="btn" type="button"></button>
        <button class="btn" type="button"></button>
        <button class="btn" type="button"></button>
      </div>
      <button id="closeModalBtn" class="btn close-btn" type="button">Schließen</button>
    </div>
  </div>

  <script>
    // Zoom/Pinch/Gesture und Scroll-Events via JS blockieren
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    });
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('wheel', function(e) {
      e.preventDefault();
    }, { passive: false });

    // Modal Steuerungs-Logik
    const docsBtn = document.getElementById('docsBtn');
    const docsModal = document.getElementById('docsModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    if (docsBtn) {
      docsBtn.addEventListener('click', () => {
        docsModal.classList.add('active');
      });
    }

    closeModalBtn.addEventListener('click', () => {
      docsModal.classList.remove('active');
    });
  </script>
</body>
</html>
